<title>Football Millionaire Screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&family=Secular+One&display=swap">
<style>
/* Layout: phone frames side by side (wrapping), each a live-styled copy of a Phase 1 screen. Single dark look, same as the app. */
:root {
  --night950: #0F0B33; --night900: #1B1452; --night800: #251C6B; --night700: #30258A; --night600: #4334B0;
  --chalk: #F7F4FF; --chalk-dim: #C9C3EE;
  --pitch: #1FCB7F; --pitch-deep: #0E8F57; --gold: #FFC93C; --gold-deep: #C98A00;
  --flare: #FF5D5D; --flare-deep: #C42E3A; --sky: #4FD8FF; --sky-deep: #1A93BE; --violet: #A877FF; --violet-deep: #6E3FD0;
  --display: "Secular One", "Arial Hebrew", "Rubik", sans-serif;
  --ui: "Rubik", "Arial Hebrew", system-ui, sans-serif;
  --page: #120E3D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--chalk); font-family: var(--ui); margin: 0; padding-inline: 16px; padding-block: 28px 48px; }
.intro { max-width: 1240px; margin: 0 auto 24px; display: grid; gap: 6px; }
.intro h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; text-wrap: balance; }
.intro p { margin: 0; color: var(--chalk-dim); max-width: 62ch; line-height: 1.55; }
.phones { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; max-width: 1240px; margin: 0 auto; }
figure { margin: 0; display: grid; gap: 10px; justify-items: center; }
figcaption { color: var(--chalk-dim); font-size: 14px; }

.phone { width: 300px; max-width: 100%; height: 640px; border-radius: 40px; border: 8px solid #06041c; background: var(--night900); position: relative; overflow: hidden; direction: rtl; }
.phone svg.pitch { position: absolute; inset: 0; width: 100%; height: 100%; }
.scroll { position: absolute; inset: 0; padding: 40px 14px 100px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }

.t-title { font-family: var(--display); font-size: 23px; line-height: 1.2; margin: 0; }
.t-heading { font-family: var(--display); font-size: 17px; line-height: 1.25; margin: 0; }
.t-body { font-size: 13px; line-height: 1.5; color: var(--chalk-dim); margin: 0; }
.t-label { font-weight: 700; font-size: 12px; margin: 0; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.who { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 12px; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--night950); border: 3px solid var(--chalk); display: grid; place-items: center; position: relative; flex: none; }
.avatar .lvl { position: absolute; bottom: -5px; inset-inline-end: -6px; background: var(--gold); color: var(--night950); border: 2px solid var(--night950); border-radius: 9px; font: 900 10px/14px var(--ui); padding: 0 4px; }
.pills { display: flex; gap: 5px; }
.pill { display: flex; align-items: center; gap: 3px; height: 30px; padding-inline: 3px 9px; border-radius: 99px; background: var(--night950); border: 2px solid var(--night600); font-family: var(--display); font-size: 14px; }

.card { position: relative; padding-bottom: 5px; }
.card::before { content: ""; position: absolute; inset: 5px 0 0; border-radius: 20px; background: var(--night950); }
.card .face { position: relative; border-radius: 20px; padding: 14px; border: 2px solid var(--night600); background: var(--night800); display: grid; gap: 6px; }
.card.sticker .face { border: 3px solid var(--chalk); }
.card.gold .face { background: var(--gold); color: var(--night950); }
.card.gold .t-body { color: var(--night950); font-weight: 500; }
.card.raised .face { background: var(--night700); }

.btn { position: relative; height: 54px; display: block; }
.btn .lip, .btn .bface { position: absolute; inset-inline: 0; height: 48px; border-radius: 16px; }
.btn .lip { top: 6px; }
.btn .bface { top: 0; display: flex; align-items: center; justify-content: center; gap: 7px; font: 900 16px var(--ui); color: var(--night950); }
.btn.lg { height: 62px; } .btn.lg .lip, .btn.lg .bface { height: 56px; } .btn.lg .bface { font-size: 18px; }
.btn.sm { height: 42px; } .btn.sm .lip, .btn.sm .bface { height: 38px; } .btn.sm .lip { top: 4px; } .btn.sm .bface { font-size: 13px; }
.primary .bface { background: var(--pitch); } .primary .lip { background: var(--pitch-deep); }
.danger .bface { background: var(--flare); } .danger .lip { background: var(--flare-deep); }
.ghost .bface { background: var(--night700); color: var(--chalk); border: 2px solid var(--night600); } .ghost .lip { background: var(--night950); }
.btn.pressed .bface { top: 6px; }

.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; display: grid; gap: 3px; }
.stickers { display: flex; gap: 8px; }
.slot { width: 76px; height: 100px; border-radius: 13px; border: 3px dashed var(--night600); background: var(--night950); display: grid; place-items: center; color: var(--chalk-dim); font: 400 26px var(--display); opacity: .7; }
.rar { width: 76px; height: 100px; border-radius: 13px; border: 3px solid var(--chalk); padding: 4px; display: grid; grid-template-rows: 1fr auto; gap: 3px; }
.rar .art { border-radius: 9px; display: grid; place-items: center; }
.rar span { font-size: 10px; text-align: center; color: var(--chalk); }

.ladder { display: grid; gap: 4px; }
.rung { height: 27px; border-radius: 14px; background: var(--night950); display: flex; justify-content: space-between; align-items: center; padding-inline: 12px; font-family: var(--display); font-size: 14px; }
.rung b { font-weight: 400; color: var(--gold); }
.rung i { font-style: normal; color: var(--chalk-dim); }
.rung.cp { background: var(--pitch); } .rung.top { background: var(--gold); }
.rung.cp b, .rung.cp i, .rung.top b, .rung.top i { color: var(--night950); }

.pack { display: flex; gap: 10px; align-items: center; }
.pack .box { width: 50px; height: 60px; border-radius: 12px; border: 3px solid var(--chalk); display: grid; place-items: center; flex: none; }
.price { display: flex; gap: 4px; align-items: center; color: var(--chalk-dim); font-family: var(--display); font-size: 14px; }
.two { display: grid; grid-template-columns: 1fr auto; gap: 8px; }

.bar { height: 12px; border-radius: 6px; background: var(--night950); border: 2px solid var(--night600); overflow: hidden; }
.bar > div { height: 100%; border-radius: 6px; background: var(--gold); position: relative; }
.bar > div::after { content: ""; position: absolute; top: 1px; inset-inline: 4px; height: 2px; background: rgba(255,255,255,.4); }

.sheet { position: absolute; inset: auto 0 0; background: var(--night800); border-top: 3px solid var(--chalk); border-radius: 26px 26px 0 0; padding: 12px 18px 26px; display: grid; gap: 10px; z-index: 3; }
.scrim { position: absolute; inset: 0; background: rgba(15,11,51,.72); z-index: 2; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--night600); justify-self: center; }
.odds { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.sw { width: 16px; height: 16px; border-radius: 5px; border: 2px solid var(--chalk); }

.tabbar { position: absolute; inset: auto 10px 12px; background: var(--night950); border: 3px solid var(--night600); border-radius: 20px; display: flex; padding: 6px 2px; z-index: 1; }
.tab { flex: 1; display: grid; justify-items: center; gap: 2px; font-size: 10px; color: var(--chalk-dim); }
.tab .ic { width: 42px; height: 28px; border-radius: 14px; display: grid; place-items: center; }
.tab.on { color: var(--chalk); } .tab.on .ic { transform: translateY(-3px); }
.toast { position: absolute; top: 36px; inset-inline: 22px; background: var(--night950); border: 2px solid var(--pitch); border-radius: 16px; padding: 9px 12px; display: flex; gap: 8px; align-items: center; font-weight: 500; font-size: 13px; z-index: 4; }
.toast i { width: 9px; height: 9px; border-radius: 50%; background: var(--pitch); flex: none; }
@media (prefers-reduced-motion: no-preference) { .btn .bface { transition: top .09s; } }
</style>

<script>
  // Same values as packages/economy-config LADDER (prize points; checkpoints at 4 and 8).
  const ladder = [[12,'500,000'],[11,'250,000'],[10,'100,000'],[9,'50,000'],[8,'25,000'],[7,'10,000'],[6,'5,000'],[5,'2,500'],[4,'1,000'],[3,'500'],[2,'250'],[1,'100']];
  document.getElementById('ladder').innerHTML = ladder.map(([n, p]) =>
    `<div class="rung${n === 12 ? ' top' : n === 4 || n === 8 ? ' cp' : ''}"><i>${n}</i><b>${p}</b></div>`).join('');
</script>
