name: Android APK

# Builds an installable APK in the cloud and publishes it as a GitHub Release,
# so it can be downloaded and installed straight from a phone.
#
# Server address comes from apps/mobile/public-config.env (Project URL + anon
# public key). Both are public by design: they ship inside the app, and RLS
# protects the data. Never put the service_role key or a database password there.
# Repository variables SUPABASE_URL / SUPABASE_ANON_KEY override the file if set.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**', '.npmrc', 'package.json', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Align Expo native packages with the SDK
        working-directory: apps/mobile
        run: ../../tools/scripts/ci-run.sh "expo install" npx expo install --fix

      - name: Write app config
        working-directory: apps/mobile
        env:
          VAR_URL: ${{ vars.SUPABASE_URL }}
          VAR_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -a; [ -f public-config.env ] && . ./public-config.env; set +a
          URL="${VAR_URL:-${SUPABASE_URL:-}}"
          KEY="${VAR_KEY:-${SUPABASE_ANON_KEY:-}}"
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::No Supabase settings yet. Building anyway; the app will open on the 'no connection' screen."
            URL="https://not-configured.invalid"; KEY="not-configured"
          fi
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env.local

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          APP_ENV: preview
        run: ../../tools/scripts/ci-run.sh prebuild npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          APP_ENV: preview
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: ../../../tools/scripts/ci-run.sh gradle ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             out/football-millionaire-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # Test build: signed with the default debug key. Fine for installing on
      # your own phone; the store build will use a real upload key (EAS).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: גרסת בדיקה ${{ github.run_number }}
          body: הורד את קובץ ה-APK והתקן אותו בטלפון.
          files: out/*.apk
          prerelease: true
