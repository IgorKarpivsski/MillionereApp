name: Android APK

# Builds an installable APK in the cloud and publishes it as a GitHub Release,
# so it can be downloaded and installed straight from a phone.
#
# Needs two repository variables (Settings → Secrets and variables → Actions → Variables):
#   SUPABASE_URL        the Project URL
#   SUPABASE_ANON_KEY   the anon public key (safe to ship in the app; RLS protects data)
# Never put the service_role key here.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'packages/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check Supabase settings
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Set SUPABASE_URL and SUPABASE_ANON_KEY under Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Align Expo native packages with the SDK
        working-directory: apps/mobile
        run: npx expo install --fix

      - name: Write app config
        working-directory: apps/mobile
        run: |
          cat > .env.local <<EOF
          EXPO_PUBLIC_SUPABASE_URL=${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
          EOF

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          APP_ENV: preview
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build APK
        working-directory: apps/mobile/android
        env:
          APP_ENV: preview
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             out/football-millionaire-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # Test build: signed with the default debug key. Fine for installing on
      # your own phone; the store build will use a real upload key (EAS).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: גרסת בדיקה ${{ github.run_number }}
          body: הורד את קובץ ה-APK והתקן אותו בטלפון.
          files: out/*.apk
          prerelease: true
