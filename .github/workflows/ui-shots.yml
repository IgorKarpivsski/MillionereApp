name: UI screenshots

# Installs the latest preview APK on an Android emulator, opens each screen
# by deep link and commits the screenshots to the data-fetch branch
# (shots/<run>/), so the design can be reviewed without a phone.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Emulator device profile
        default: pixel_6
      script:
        description: Script under tools/scripts to run on the emulator
        default: ui-shots.sh

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Align Expo native packages with the SDK
        working-directory: apps/mobile
        run: ../../tools/scripts/ci-run.sh "expo install" npx expo install --fix
      - name: Write app config
        working-directory: apps/mobile
        env:
          VAR_URL: ${{ vars.SUPABASE_URL }}
          VAR_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -a; [ -f public-config.env ] && . ./public-config.env; set +a
          URL="${VAR_URL:-${SUPABASE_URL:-}}"
          KEY="${VAR_KEY:-${SUPABASE_ANON_KEY:-}}"
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$URL" "$KEY" > .env.local
      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          APP_ENV: preview
        run: ../../tools/scripts/ci-run.sh prebuild npx expo prebuild --platform android --no-install --clean
      - name: Build x86_64 APK (emulator only)
        working-directory: apps/mobile/android
        env:
          APP_ENV: preview
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
          NODE_ENV: production
        run: ../../../tools/scripts/ci-run.sh gradle ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

  shots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86
          path: apk
      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: ${{ inputs.profile || 'pixel_6' }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/scripts/${{ inputs.script || 'ui-shots.sh' }}
      - name: Commit screenshots
        if: always()
        run: |
          [ -d shots ] || exit 0
          git config user.name "football-data-bot"
          git config user.email "bot@users.noreply.github.com"
          mv shots /tmp/shots
          git fetch origin data-fetch
          git checkout -B data-fetch origin/data-fetch
          mkdir -p shots && rm -rf "shots/${{ github.run_number }}" && mv /tmp/shots "shots/${{ github.run_number }}"
          git add shots
          git commit -m "UI screenshots run ${{ github.run_number }}" || exit 0
          git push origin data-fetch
