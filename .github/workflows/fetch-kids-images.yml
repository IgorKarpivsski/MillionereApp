name: Fetch kids photo questions

# Resolves the free Wikipedia/Commons photo (author + license) for every line in
# tools/question-gen/kids/*.img.txt and renders review contact sheets.
# Commits data/kids-images/* back to the kids-images branch.
on:
  workflow_dispatch:
  push:
    branches: [kids-images]
    paths: ['tools/question-gen/kids/*.img.txt', 'tools/question-gen/fetch-kids-images.mjs', 'tools/question-gen/kids_sheets.py', '.github/workflows/fetch-kids-images.yml']

permissions:
  contents: write

concurrency:
  group: kids-images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/question-gen/fetch-kids-images.mjs
      - run: pip install pillow && python3 tools/question-gen/kids_sheets.py
      - name: Commit data
        run: |
          git config user.name "football-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/kids-images
          git commit -m "kids images $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase && git push
