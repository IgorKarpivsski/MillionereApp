name: Fetch general knowledge data

# General trivia facts (Wikidata, CC0) + image credits (Wikimedia Commons)
# for tools/question-gen/gen_general.py. Commits data/general/*.
on:
  workflow_dispatch:
  push:
    branches: [data-fetch]
    paths: ['tools/question-gen/fetch-general.mjs', '.github/workflows/fetch-general.yml', 'data/general/.refetch']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: tools/scripts/ci-run.sh general node tools/question-gen/fetch-general.mjs
      - name: Commit data
        if: always()
        run: |
          git config user.name "football-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/general || true
          git commit -m "general snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase && git push
