name: Fetch AI art

on:
  workflow_dispatch:
  push:
    branches: [data-fetch]
    paths: ['art/manifest.tsv', 'tools/scripts/fetch-ai-art.py', '.github/workflows/fetch-ai-art.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow
      - run: python3 tools/scripts/fetch-ai-art.py
      - name: Commit
        run: |
          git config user.name "football-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apps/mobile/assets || true
          git commit -m "AI art $(date -u +%H:%M)" || echo "no changes"
          git pull --rebase && git push
