name: Fetch football data

# Pulls football facts from Wikidata (CC0) for the question generator and
# commits them to the data-fetch branch. Runs on push to that branch.
on:
  workflow_dispatch:
  push:
    branches: [data-fetch]
    paths: ['tools/question-gen/fetch-*.mjs', '.github/workflows/fetch-football-data.yml']

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          [ -f data/wikidata/players_famous.json ] || node tools/question-gen/fetch-wikidata.mjs
          [ -f data/wikidata/wiki_titles.json ] || node tools/question-gen/fetch-wikidata-2.mjs
          node tools/question-gen/fetch-wikidata-3.mjs
      - name: Commit data
        run: |
          git config user.name "football-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "Wikidata snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git push
