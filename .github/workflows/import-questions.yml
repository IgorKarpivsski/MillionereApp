name: Import questions

# Loads content/questions/questions.jsonl into Supabase. The import token is
# single-use: it is disabled on the server right after the import.
on:
  push:
    branches: [data-fetch]
    paths: ['content/questions/questions.jsonl', '.github/workflows/import-questions.yml']

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import
        run: |
          set -a; . apps/mobile/public-config.env; set +a
          node tools/question-gen/import.mjs
        env:
          IMPORT_TOKEN: d15e9555d106092eaedcc7bc2b4ad86d8fc1158dba7fc878
